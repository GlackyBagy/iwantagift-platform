spring:
  application:
    name: mail-service
  kafka:
    consumer:
      group-id: mail-service
    bootstrap-servers:  ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000