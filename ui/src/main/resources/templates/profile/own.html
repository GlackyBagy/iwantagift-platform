<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(
    title='Profile',
    extraCss=${profileCss})}">
    <title></title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="profile-page">
    <div class="container">
        <div class="profile-layout">
            <aside class="profile-sidebar" aria-label="Wishlists">
                <h2 class="profile-sidebar-title">Wishlists</h2>
                <nav class="profile-wishlist-list">
                    <a class="profile-wishlist-link profile-create-list-link"
                       th:href="@{/wishlist/new}">+ Create list</a>
                    <div th:each="wishlist : ${wishlists}"
                         class="profile-wishlist-link profile-wishlist-row"
                         th:classappend="${wishlist.id == selectedWishlist.id} ? ' active'">
                        <a class="profile-wishlist-title"
                           th:href="@{/profile(listId=${wishlist.id})}"
                           th:text="${wishlist.title}">Wishlist</a>
                        <span class="profile-wishlist-actions" aria-label="Wishlist actions">
                            <a class="profile-wishlist-action"
                               th:href="@{/wishlist/{listId}/edit(listId=${wishlist.id})}"
                               aria-label="Edit wishlist">
                                <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/pencil.svg"
                                     onerror="this.onerror=null;this.src='/img/pencil.svg';"
                                     alt="">
                            </a>
                            <a class="profile-wishlist-action"
                               th:href="@{/wishlist/{listId}(listId=${wishlist.id})}"
                               aria-label="Share wishlist">
                                <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/share.svg"
                                     onerror="this.onerror=null;this.src='/img/share.svg';"
                                     alt="">
                            </a>
                        </span>
                    </div>
                </nav>
            </aside>

            <section class="profile-main">
                <section class="profile-hero">
                    <img id="profileAvatar"
                         class="profile-avatar"
                         th:src="${profileAvatarUrl}"
                         alt="User avatar">
                    <h1 id="profileNickname"
                        class="profile-nickname"
                        th:text="${profileNickname}">Nickname</h1>
                    <a class="btn btn-auth btn-to-profile profile-action-button"
                       th:href="@{/settings}">Edit</a>
                    <div class="profile-description-box">
                        <p id="profileDescription"
                           th:text="${profileDescription}">Profile description</p>
                    </div>
                </section>

                <div class="profile-wishes">
                    <section class="wish-grid"
                             th:if="${selectedWishlist.wishes != null and !#lists.isEmpty(selectedWishlist.wishes)}">
                        <article class="wish-tile" th:each="wish : ${selectedWishlist.wishes}">
                            <img class="wish-image"
                                 th:src="@{/img/logo_load_error.png}"
                                 alt="">

                            <div>
                                <h2 class="wish-title" th:text="${wish.title}">Wish title</h2>
                                <p class="wish-description"
                                   th:if="${wish.description != null and !#strings.isEmpty(wish.description)}"
                                   th:text="${wish.description}">Wish description</p>
                            </div>

                            <a class="wish-link"
                               th:if="${wish.url != null and !#strings.isEmpty(wish.url)}"
                               th:href="${wish.url}"
                               target="_blank"
                               rel="noopener noreferrer">Open link</a>
                        </article>
                    </section>

                    <section class="wishlist-empty"
                             th:if="${selectedWishlist.wishes == null or #lists.isEmpty(selectedWishlist.wishes)}">
                        <p>This wishlist has no wishes yet.</p>
                    </section>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
