<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(
    title='iwag - Error',
    extraCss=${{'/css/error/errorStyle.css'}})}">
    <title></title>
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="error-main d-flex align-items-center py-5">
        <div class="container">
            <section class="card error-card mx-auto">
                <div class="card-body text-center py-5 px-4 px-md-5">
                    <div class="error-code mb-3" th:text="${status ?: 500}">500</div>
                    <h1 class="error-title mb-3">Something went wrong</h1>
                    <p class="error-text mx-auto mb-4">
                        The service could not complete this request. Please try again in a moment.
                    </p>
                    <div class="error-actions d-flex flex-column flex-sm-row justify-content-center">
                        <a th:href="@{/}" class="btn btn-auth px-4">Go home</a>
                        <button type="button" class="btn btn-outline-light btn-error-secondary px-4"
                                onclick="window.location.reload()">Retry</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
