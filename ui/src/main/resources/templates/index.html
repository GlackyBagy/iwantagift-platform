<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(title='iwag — home', extraCss=${#lists.toList({'/css/home/homeStyle.css'})})}">
    <title></title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="home-page">
    <div class="container">

        <div class="text-center mb-2">
            <p class="home-eyebrow">Dashboard</p>
            <h1 class="home-title">What's next?</h1>
            <p class="home-subtitle">Add a wish or start a fresh wishlist</p>
            <div class="home-actions d-flex gap-3 justify-content-center flex-wrap">
                <a th:href="@{/wish/new}" class="btn btn-auth btn-lg home-action-btn">+ Create wish</a>
                <a th:href="@{/wishlist/new}" class="btn btn-outline-light btn-lg home-action-btn">+ Create wishlist</a>
            </div>
        </div>

        <div class="row g-3 home-cards">
            <div class="col-12 col-sm-6 col-lg-4">
                <a th:href="@{/profile}" class="home-card">
                    <div class="home-card-icon">&#128100;</div>
                    <h2 class="home-card-title">My profile</h2>
                    <p class="home-card-text">View your wishlists and wishes</p>
                </a>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <a th:href="@{/wishlist/new}" class="home-card">
                    <div class="home-card-icon">&#128222;</div>
                    <h2 class="home-card-title">New wishlist</h2>
                    <p class="home-card-text">Organize your wishes into a list and share it</p>
                </a>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <a th:href="@{/settings}" class="home-card">
                    <div class="home-card-icon">&#9881;&#65039;</div>
                    <h2 class="home-card-title">Settings</h2>
                    <p class="home-card-text">Manage your account and preferences</p>
                </a>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
