<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(title='iwag — Add wish', extraCss=${#lists.toList({'/css/form/formStyle.css'})})}">
    <title>iwag — Add wish</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="form-page">
    <div class="container">
        <div class="form-card">
            <p class="form-eyebrow">Wishes</p>
            <h1 class="form-title">Add wish</h1>
            <form th:action="@{/wish/new}" th:object="${wishPayload}" method="post">

                <div class="form-field">
                    <label class="form-label" th:for="${#ids.next('title')}">Title</label>
                    <input type="text" class="form-control form-control-dark"
                           placeholder="Enter wish title" th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <div class="form-field">
                    <label class="form-label" th:for="${#ids.next('wishlistId')}">Wishlist</label>
                    <select class="form-control form-control-dark" th:field="*{wishlistId}"
                            th:classappend="${#fields.hasErrors('wishlistId')} ? 'is-invalid' : ''">
                        <option value="">Select wishlist</option>
                        <option th:each="wishlist : ${wlList}"
                                th:value="${wishlist.id}"
                                th:text="${wishlist.title}">Wishlist</option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('wishlistId')}"
                         th:errors="*{wishlistId}"></div>
                </div>

                <div class="form-field">
                    <label class="form-label" th:for="${#ids.next('url')}">URL</label>
                    <input type="url" class="form-control form-control-dark"
                           placeholder="https://example.com" th:field="*{url}"
                           th:classappend="${#fields.hasErrors('url')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('url')}"
                         th:errors="*{url}"></div>
                </div>

                <div class="form-field">
                    <label class="form-label" th:for="${#ids.next('defaultPrice')}">Default price</label>
                    <input type="number" class="form-control form-control-dark"
                           placeholder="0" min="0" step="1" th:field="*{defaultPrice}"
                           th:classappend="${#fields.hasErrors('defaultPrice')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('defaultPrice')}"
                         th:errors="*{defaultPrice}"></div>
                </div>

                <div class="form-field">
                    <label class="form-label" th:for="${#ids.next('description')}">Description</label>
                    <textarea class="form-control form-control-dark" rows="4"
                              placeholder="Add details" th:field="*{description}"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-auth">Add wish</button>
                    <a th:href="@{/}" class="btn btn-outline-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
