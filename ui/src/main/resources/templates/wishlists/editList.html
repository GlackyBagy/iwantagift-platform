<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(title='iwag — Edit wishlist', extraCss=${#lists.toList({'/css/form/formStyle.css'})})}">
    <title>iwag — Edit wishlist</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="form-page">
    <div class="container">
        <div class="form-card">
            <p class="form-eyebrow">Wishlists</p>
            <h1 class="form-title">Edit wishlist</h1>
            <form th:action="@{/wishlist/{listId}/edit(listId=${listId})}"
                  th:object="${wishlistPayload}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-field">
                    <label class="form-label" th:for="${#ids.next('title')}">Title</label>
                    <input type="text" class="form-control form-control-dark"
                           placeholder="Enter wishlist title" th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <div class="form-field">
                    <label class="form-label" th:for="${#ids.next('description')}">Description</label>
                    <textarea class="form-control form-control-dark" rows="4"
                              placeholder="Add a short description" th:field="*{description}"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-auth">Save changes</button>
                    <a th:href="@{/wishlist/{listId}(listId=${listId})}" class="btn btn-outline-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
