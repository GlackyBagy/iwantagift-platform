<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(
    title='iwag - Create wishlist',
    extraCss=${{'/css/auth/authStyle.css'}})}">
    <title></title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main>
    <div class="container">
        <div class="card hero-card mx-auto">
            <div class="card-body text-center py-5 px-1">
                <h1 class="hero-title mb-4">Create wishlist</h1>
                <form id="createList" th:action="@{/wishlist/new}" th:object="${wishlistPayload}" method="post"
                      class="w-100" style="max-width: 420px; margin: 0 auto;">

                    <div class="mb-3 text-start">
                        <label class="form-label text-light">Title</label>
                        <input type="text" class="form-control form-control-dark"
                               placeholder="Enter wishlist title" th:field="*{title}"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}">
                        </div>
                    </div>

                    <div class="mb-4 text-start">
                        <label class="form-label text-light">Description</label>
                        <textarea class="form-control form-control-dark" rows="5"
                                  placeholder="Add a short description" th:field="*{description}"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-auth">Create wishlist</button>
                        <a th:href="@{/}" class="btn btn-outline-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
