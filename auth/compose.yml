  auth-db:
    image: postgres:18
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "auth"
    ports:
      - "9912:5432"

  auth-cache:
    image: redis:8.6
    command: redis-server --requirepass RDSpassword
    ports:
      - "9922:6379"

# Kafka is shared across services in dev: auth publishes to the broker
# from wishlist/compose.yml (localhost:9092), so no own broker here.
