<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(
    title='iwag - Confirm data deletion',
    extraCss=${#lists.toList({'/css/auth/authStyle.css'})})}">
    <title></title>
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="d-flex flex-column" style="min-height: 80vh;">
        <div class="container">
            <div class="card hero-card mx-auto">
                <div class="card-body text-center py-5 px-4">
                    <h1 class="hero-title mb-4">Confirm data deletion</h1>

                    <!-- Initial state: ask the user to confirm or cancel the deletion. -->
                    <div th:if="${status == null}" style="max-width: 420px; margin: 0 auto;">
                        <p class="text-secondary mb-4">
                            Are you sure you want to delete all wishlists and wishes? This action is irreversible.
                            Your account will remain active.
                        </p>

                        <div class="d-flex gap-3 justify-content-center">
                            <form th:action="@{/auth/deleteAll/confirm}" method="post">
                                <input th:if="${_csrf != null}"
                                       type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <input type="hidden" name="token" th:value="${token}">
                                <button type="submit" class="btn btn-danger">Delete all</button>
                            </form>

                            <a th:href="${uiBaseUrl} + '/settings'" class="btn btn-outline-light">Cancel</a>
                        </div>
                    </div>

                    <div th:if="${status == 'deleted'}" class="alert alert-success text-start" role="alert">
                        All wishlists and wishes will be deleted soon.
                    </div>

                    <div th:if="${status == 'invalid'}" class="alert alert-danger text-start" role="alert">
                        This deletion link is invalid or has expired. Please try again from settings.
                    </div>

                    <div th:if="${status != null}" class="mt-4">
                        <a th:href="${uiBaseUrl} + '/settings'" class="auth-link">Back to settings</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
