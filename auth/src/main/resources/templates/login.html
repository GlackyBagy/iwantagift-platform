<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head(
    title='iwag - Sign in',
    extraCss=${{'/css/auth/authStyle.css'}})}">
    <title></title>
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="d-flex flex-column" style="min-height: 80vh;">
        <div class="container">
            <div class="card hero-card mx-auto">
                <div class="card-body text-center py-5 px-4">
                    <h1 class="hero-title mb-4">Sign in</h1>

                    <div th:if="${param.error}" class="alert alert-danger text-start" role="alert">
                        Invalid email or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success text-start" role="alert">
                        You have been signed out.
                    </div>

                    <form th:action="@{/login}" method="post" class="w-100" style="max-width: 420px; margin: 0 auto;">
                        <input th:if="${_csrf != null}"
                               type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="form-floating mb-3">
                            <input type="email"
                                   class="form-control form-control-dark"
                                   id="username"
                                   name="username"
                                   autocomplete="email"
                                   placeholder="Email"
                                   required>
                            <label for="username">Email</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password"
                                   class="form-control form-control-dark"
                                   id="password"
                                   name="password"
                                   autocomplete="current-password"
                                   placeholder="Password"
                                   required>
                            <label for="password">Password</label>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-auth">Continue</button>
                        </div>

                        <div class="auth-divider my-4 d-flex align-items-center">
                            <hr class="flex-grow-1">
                            <span class="px-3 text-secondary small">
                                Don't have an account?
                                <a href="http://localhost:8080/auth/signup" class="auth-link">Sign up</a>
                            </span>
                            <hr class="flex-grow-1">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
