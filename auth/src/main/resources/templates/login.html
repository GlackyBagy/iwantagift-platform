<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head(
    title='iwag - Sign in',
    extraCss=${{'/css/auth/authStyle.css'}})}">
    <title></title>
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="d-flex flex-column" style="min-height: 80vh;">
        <div class="container">
            <div class="card hero-card mx-auto">
                <div class="card-body text-center py-5 px-4">
                    <h1 class="hero-title mb-4">Sign in</h1>

                    <div th:if="${param.logout}" class="alert alert-success text-start" role="alert">
                        You have been signed out.
                    </div>

                    <form id="loginForm" th:action="@{/login}" th:object="${loginForm}" method="post" novalidate
                          class="w-100" style="max-width: 420px; margin: 0 auto;">
                        <input th:if="${_csrf != null}"
                               type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- Shared authentication error (bad credentials are not field-specific) -->
                        <div id="loginError" class="invalid-feedback d-block text-start mb-3"
                             th:if="${#fields.hasGlobalErrors()}">
                            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email"
                                   class="form-control form-control-dark"
                                   autocomplete="email"
                                   placeholder="Email"
                                   th:field="*{username}"
                                   th:classappend="${#fields.hasGlobalErrors()} ? 'is-invalid'"
                                   required>
                            <label for="username">Email</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password"
                                   class="form-control form-control-dark"
                                   autocomplete="current-password"
                                   placeholder="Password"
                                   th:field="*{password}"
                                   th:classappend="${#fields.hasGlobalErrors()} ? 'is-invalid'"
                                   required>
                            <label for="password">Password</label>
                        </div>

                        <div id="validationError" class="text-danger small mb-3 d-none"></div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-auth">Continue</button>
                        </div>

                        <div class="text-center mb-3">
                            <a th:href="@{/auth/reset/password}" class="auth-link">Forgot password?</a>
                        </div>

                        <div class="auth-divider my-4 d-flex align-items-center">
                            <hr class="flex-grow-1">
                            <span class="px-3 text-secondary small">
                                Don't have an account?
                                <a th:href="${uiBaseUrl} + '/auth/signup'" class="auth-link">Sign up</a>
                            </span>
                            <hr class="flex-grow-1">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/credentialsValidation.js}"></script>
    <!-- OAuth2 protocol failure bounced back from the ui -->
    <script th:if="${oauthError}">
        window.addEventListener('DOMContentLoaded', function () {
            alert('Sign-in could not be completed. Please try again.');
        });
    </script>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
