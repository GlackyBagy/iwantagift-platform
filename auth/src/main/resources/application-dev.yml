spring:
  docker:
    compose:
      enabled: true
      file: auth/compose.yml
      lifecycle-management: start-only
  application:
    name: "auth"
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8091
  kafka:
    # shared dev broker from wishlist/compose.yml — events must reach other services
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:9912/auth
    username: "postgres"
    password: "postgres"
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 9922
      password: RDSpassword
server:
  port: 8091
  servlet:
    session:
      cookie:
        # ui and auth both run on "localhost" (port is ignored for cookies),
        # so a shared JSESSIONID would overwrite the ui session and break the OAuth2 flow
        name: AUTH_SESSIONID
iwag:
  ui-base-url: http://localhost:8080
  services:
    wishlist:
      kafka-topics:
        - createdUser
        - deletedUser
    profile:
      kafka-topics:
        - createdUser
