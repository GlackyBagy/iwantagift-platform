services:
#  backend:
#    image: hz:latest
#    ports:
#      - "8080:8080"
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "wishdb"
    ports:
      - "9911:5432"

  cache:
    image: redis:8.6
    command: redis-server --requirepass RDSpassword
    ports:
      - "9921:6379"
  broker:
    image: apache/kafka:4.2.0
    ports:
      - "9092:9092"

